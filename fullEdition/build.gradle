plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'net.terraimmerse'
version = 'classic-0.2.0'

application {
    mainClass = 'net.terraimmerse.client.TerraImmerse'
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()){
        applicationDefaultJvmArgs=['-XstartOnFirstThread']
    }
}

repositories {
    mavenCentral()
}

project.ext.lwjglVersion = "3.4.2"
project.ext.jomlVersion = "1.10.9"

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.joml:joml:$jomlVersion"
    implementation "com.google.code.gson:gson:2.13.1"
    implementation "com.raylabz:opensimplex:1.0.3"
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        def macArch = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
        runtimeOnly "org.lwjgl:lwjgl::$macArch"
        runtimeOnly "org.lwjgl:lwjgl-glfw::$macArch"
        runtimeOnly "org.lwjgl:lwjgl-opengl::$macArch"
        runtimeOnly "org.lwjgl:lwjgl-stb::$macArch"
    } else if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        def winArch = System.getProperty("os.arch").contains("64") ? "natives-windows" : "natives-windows-x86"
        runtimeOnly "org.lwjgl:lwjgl::$winArch"
        runtimeOnly "org.lwjgl:lwjgl-glfw::$winArch"
        runtimeOnly "org.lwjgl:lwjgl-opengl::$winArch"
        runtimeOnly "org.lwjgl:lwjgl-stb::$winArch"
    } else if (org.gradle.internal.os.OperatingSystem.current().isLinux()) {
        def linuxArch = System.getProperty("os.arch").contains("64") ? "natives-linux" : "natives-linux-arm32"
        runtimeOnly "org.lwjgl:lwjgl::$linuxArch"
        runtimeOnly "org.lwjgl:lwjgl-glfw::$linuxArch"
        runtimeOnly "org.lwjgl:lwjgl-opengl::$linuxArch"
        runtimeOnly "org.lwjgl:lwjgl-stb::$linuxArch"
    }
}

shadowJar {
    archiveBaseName = "TerraImmerse"
    archiveVersion = version
    archiveClassifier = ""
    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }
}

def nativeModules = [
        "lwjgl",
        "lwjgl-glfw",
        "lwjgl-opengl",
        "lwjgl-stb"
]

def nativePlatforms = [
        "linux-x64": "natives-linux",
        "linux-arm64": "natives-linux-arm64",
        "linux-arm32": "natives-linux-arm32",
        "linux-ppc64le": "natives-linux-ppc64le",
        "linux-riscv64": "natives-linux-riscv64",
        "macos-x64": "natives-macos",
        "macos-arm64": "natives-macos-arm64",
        "windows-x64": "natives-windows",
        "windows-x86": "natives-windows-x86",
        "windows-arm64": "natives-windows-arm64"
]

def nativeConfigurations = [:]

nativePlatforms.each { platformName, nativeClassifier ->
    def configurationName = "terraImmerse_${platformName.replaceAll("-", "_")}"
    nativeConfigurations[platformName] = configurations.create(configurationName)
    nativeModules.each { module ->
        dependencies.add(
                configurationName,
                "org.lwjgl:${module}:${lwjglVersion}:${nativeClassifier}"
        )
    }
}

tasks.register("downloadAllNatives") {
    group = "terraimmerse"
    description = "Downloads LWJGL native libraries into organized folders for server distribution."
    doLast {
        def outputRoot = file("$projectDir/natives")
        println ""
        println "=============================================="
        println " TerraImmerse - LWJGL Native Downloader"
        println " LWJGL version: $lwjglVersion"
        println "=============================================="
        println ""
        nativeConfigurations.each { platformName, configuration ->
            def outputDir = file("$outputRoot/$platformName")
            delete outputDir
            outputDir.mkdirs()
            println "Platform: $platformName"
            configuration.resolve().each { nativeJar ->
                println "  Reading: ${nativeJar.name}"
                copy {
                    from zipTree(nativeJar)
                    include "**/liblwjgl.so"
                    include "**/liblwjgl_opengl.so"
                    include "**/liblwjgl_stb.so"
                    include "**/libglfw.so"
                    include "**/lwjgl.dll"
                    include "**/lwjgl_opengl.dll"
                    include "**/lwjgl_stb.dll"
                    include "**/glfw.dll"
                    include "**/liblwjgl.dylib"
                    include "**/liblwjgl_opengl.dylib"
                    include "**/liblwjgl_stb.dylib"
                    include "**/libglfw.dylib"
                    eachFile {
                        path = name
                    }
                    includeEmptyDirs = false
                    into outputDir
                }
            }
            println ""
            println "  Result:"
            outputDir.listFiles()?.each {
                println "    ${it.name}"
            }
            println ""
        }
        println "=============================================="
        println " All LWJGL natives downloaded!"
        println " Location: $outputRoot"
        println "=============================================="
    }
}