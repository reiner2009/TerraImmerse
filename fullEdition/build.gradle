import org.gradle.internal.os.OperatingSystem
plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
}
group = 'net.terraimmerse'
version = 'classic-0.4.0'
application {
    mainClass = 'net.terraimmerse.client.TerraImmerse'
}
repositories {
    mavenCentral()
}
project.ext.lwjglVersion = "3.4.2"
project.ext.jomlVersion = "1.10.9"
switch (OperatingSystem.current()) {
    case OperatingSystem.FREE_BSD:
        project.ext.lwjglNatives = "natives-freebsd"
        break
    case OperatingSystem.LINUX:
        project.ext.lwjglNatives = "natives-linux"
        def osArch = System.getProperty("os.arch")
        if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
            project.ext.lwjglNatives += osArch.contains("64") || osArch.startsWith("armv8") ? "-arm64" : "-arm32"
        } else if (osArch.startsWith("ppc")) {
            project.ext.lwjglNatives += "-ppc64le"
        } else if (osArch.startsWith("riscv")) {
            project.ext.lwjglNatives += "-riscv64"
        }
        break
    case OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
        break
    case OperatingSystem.WINDOWS:
        def osArch = System.getProperty("os.arch")
        project.ext.lwjglNatives = osArch.contains("64") ? "natives-windows${osArch.startsWith("aarch64") ? "-arm64" : ""}" : "natives-windows-x86"
        break
}
configurations {
    terraImmerseNatives
}
dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.joml:joml:$jomlVersion"
    implementation "com.google.code.gson:gson:2.13.1"
    implementation "com.raylabz:opensimplex:1.0.3"
    terraImmerseNatives "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    terraImmerseNatives "org.lwjgl:lwjgl-glfw:$lwjglVersion:$lwjglNatives"
    terraImmerseNatives "org.lwjgl:lwjgl-opengl:$lwjglVersion:$lwjglNatives"
    terraImmerseNatives "org.lwjgl:lwjgl-stb:$lwjglVersion:$lwjglNatives"
}
tasks.named("run") {
    classpath += configurations.terraImmerseNatives
    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        jvmArgs "-XstartOnFirstThread"
    }
}
tasks.named("shadowJar") {
    archiveBaseName = "TerraImmerse"
    archiveVersion = version
    archiveClassifier = ""
    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }
}
def lwjglVersion = "3.4.2"
def nativeModules = [
        "lwjgl",
        "lwjgl-glfw",
        "lwjgl-opengl",
        "lwjgl-stb"
]
def nativePlatforms = [
        "linux-x64": "natives-linux",
        "linux-arm64": "natives-linux-arm64",
        "linux-arm32": "natives-linux-arm32",
        "linux-ppc64le": "natives-linux-ppc64le",
        "linux-riscv64": "natives-linux-riscv64",
        "macos-x64": "natives-macos",
        "macos-arm64": "natives-macos-arm64",
        "windows-x64": "natives-windows",
        "windows-x86": "natives-windows-x86",
        "windows-arm64": "natives-windows-arm64"
]
def nativeConfigurations = [:]
nativePlatforms.each { platformName, nativeClassifier ->
    def configurationName = "terraImmerse_${platformName.replaceAll("-", "_")}"
    nativeConfigurations[platformName] = configurations.create(configurationName)
    nativeModules.each { module ->
        dependencies.add(
                configurationName,
                "org.lwjgl:${module}:${lwjglVersion}:${nativeClassifier}"
        )
    }
}
tasks.register("downloadAllNatives") {
    group = "terraimmerse"
    description = "Downloads only the required LWJGL native libraries."
    doLast {
        def outputRoot = file("$projectDir/natives")
        println ""
        println "=============================================="
        println " TerraImmerse - LWJGL Native Downloader"
        println " LWJGL version: $lwjglVersion"
        println "=============================================="
        println ""
        nativeConfigurations.each { platformName, configuration ->
            def outputDir = file("$outputRoot/$platformName")
            delete outputDir
            outputDir.mkdirs()
            println "Platform: $platformName"
            configuration.resolve().each { nativeJar ->
                println "  Reading: ${nativeJar.name}"
                copy {
                    from zipTree(nativeJar)
                    include "**/liblwjgl.so"
                    include "**/liblwjgl_opengl.so"
                    include "**/liblwjgl_stb.so"
                    include "**/libglfw.so"
                    include "**/lwjgl.dll"
                    include "**/lwjgl_opengl.dll"
                    include "**/lwjgl_stb.dll"
                    include "**/glfw.dll"
                    include "**/liblwjgl.dylib"
                    include "**/liblwjgl_opengl.dylib"
                    include "**/liblwjgl_stb.dylib"
                    include "**/libglfw.dylib"
                    eachFile {
                        path = name
                    }
                    includeEmptyDirs = false
                    into outputDir
                }
            }
            println ""
            println "  Result:"
            outputDir.listFiles()?.each {
                println "    ${it.name}"
            }
            println ""
        }
        println "=============================================="
        println " All LWJGL natives downloaded!"
        println " Location:"
        println " $outputRoot"
        println "=============================================="
    }
}