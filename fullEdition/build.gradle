shadowJar {
    archiveBaseName = "TerraImmerse"
    archiveVersion = version
    archiveClassifier = ""
    exclude("**/*.so")
    exclude("**/*.dll")
    exclude("**/*.dylib")

    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}

def lwjglVersion = "3.4.2"

def nativeModules = [
    "lwjgl",
    "lwjgl-glfw",
    "lwjgl-opengl",
    "lwjgl-stb"
]

def nativePlatforms = [
    "linux-x64": "natives-linux",
    "linux-arm64": "natives-linux-arm64",
    "linux-arm32": "natives-linux-arm32",
    "linux-ppc64le": "natives-linux-ppc64le",
    "linux-riscv64": "natives-linux-riscv64",

    "macos-x64": "natives-macos",
    "macos-arm64": "natives-macos-arm64",

    "windows-x64": "natives-windows",
    "windows-x86": "natives-windows-x86",
    "windows-arm64": "natives-windows-arm64"
]

def nativeConfigurations = [:]

nativePlatforms.each { platformName, nativeClassifier ->

    def configurationName =
            "terraImmerse_${platformName.replaceAll("-", "_")}"

    nativeConfigurations[platformName] = configurations.create(configurationName)

    nativeModules.each { module ->

        dependencies.add(
            configurationName,
            "org.lwjgl:${module}:${lwjglVersion}:${nativeClassifier}"
        )
    }
}


tasks.register("downloadAllNatives") {

    group = "terraimmerse"
    description = "Downloads only the required LWJGL native libraries."

    doLast {

        def outputRoot = file("$projectDir/natives")

        println ""
        println "=============================================="
        println " TerraImmerse - LWJGL Native Downloader"
        println " LWJGL version: $lwjglVersion"
        println "=============================================="
        println ""

        nativeConfigurations.each { platformName, configuration ->

            def outputDir = file("$outputRoot/$platformName")

            // Alte Dateien/Struktur dieser Plattform löschen
            delete outputDir

            outputDir.mkdirs()

            println "Platform: $platformName"

            configuration.resolve().each { nativeJar ->

                println "  Reading: ${nativeJar.name}"

                copy {
                    from zipTree(nativeJar)

                    // NUR die tatsächlich benötigten Libraries
                    include "**/liblwjgl.so"
                    include "**/liblwjgl_opengl.so"
                    include "**/liblwjgl_stb.so"
                    include "**/libglfw.so"

                    include "**/lwjgl.dll"
                    include "**/lwjgl_opengl.dll"
                    include "**/lwjgl_stb.dll"
                    include "**/glfw.dll"

                    include "**/liblwjgl.dylib"
                    include "**/liblwjgl_opengl.dylib"
                    include "**/liblwjgl_stb.dylib"
                    include "**/libglfw.dylib"

                    // Dateien direkt in den Plattformordner
                    eachFile {
                        path = name
                    }

                    includeEmptyDirs = false
                    into outputDir
                }
            }

            println ""
            println "  Result:"

            outputDir.listFiles()?.each {
                println "    ${it.name}"
            }

            println ""
        }

        println "=============================================="
        println " All LWJGL natives downloaded!"
        println " Location:"
        println " $outputRoot"
        println "=============================================="
    }
}