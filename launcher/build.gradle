plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'net.terraimmerse'
version = '1.0-Pi'

application {
    mainClass = 'com.trhein.TerraImmerseLauncher.Launcher'
}

repositories {
    mavenCentral()
}

project.ext.lwjglVersion = "3.4.2"
project.ext.lwjglNatives = "natives-linux-arm32"
project.ext.jomlVersion = "1.10.9"

dependencies {
}

shadowJar {
    archiveBaseName = "TerraImmerse-Launcher"
    archiveVersion = version
    archiveClassifier = ""

    // Natives NICHT in die JAR packen
    exclude("**/*.so")
    exclude("**/*.dll")
    exclude("**/*.dylib")

    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}

