plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'net.terraimmerse'
version = '1.0'

application {
    mainClass = 'com.trhein.TerraImmerseLauncher.Launcher'
}

repositories {
    mavenCentral()
}

dependencies {
}

shadowJar {
    archiveBaseName = "TerraImmerse-Launcher"
    archiveVersion = version
    archiveClassifier = ""
    exclude("**/*.so")
    exclude("**/*.dll")
    exclude("**/*.dylib")

    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}

